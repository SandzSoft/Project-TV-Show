<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="TV Show Project by Sandani Kannangara displaying Game of Thrones episodes using data from TVMaze."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Sandani Kannangara (SandzSoft)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <section id="episode-controls">
      <label for="episode-selector">
        Episode Selector:
        <select id="episode-selector">
          <option value="">-- Select an Episode --</option>
        </select>
      </label>

      <label for="episode-search">
        Search For Episodes:
        <input
          type="text"
          id="episode-search"
          placeholder="🔍Enter Episode Name"
        />
      </label>
      <p id="disply-episodes"></p>
    </section>

    <main id="root"></main>
    <footer>
      <a
        href="https://www.tvmaze.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Data provided by TVMaze
      </a>
    </footer>

    <!-- Loads a provided function called getAllEpisodes() which returns all episodes -->
    <script src="episodes.js"></script>

    <!-- Loads YOUR javascript code -->
    <script src="script.js"></script>
  </body>
</html>
